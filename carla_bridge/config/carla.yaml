# =============================================================================
# CARLA 闭环集成配置（carla_bridge）
# =============================================================================
# 与 src/vla_memory 的 config/*.yaml 解耦：本文件由 carla_bridge 入口脚本
# 通过 load_config(overrides=<本文件内容>) 深合并进主配置，不改 src/、
# 不改现有 config/。carla_bridge 代码用 config.get_nested("carla", ...) 读取。
# =============================================================================

# ---- 顶层：数据集标识（写入中期记忆 source_dataset，与 nuScenes 区分）----
dataset_name: "carla"
version: "0.9.15"

# ⚠️ 历史 workaround 已移除：src/vla_memory/memory/mid_term_memory.py 的检索权重键名
# 错位（f"{key}_weight" 查 visual_score_weight，而 memory.yaml 定义 visual_weight）已修复，
# 无需再注入视觉/文本/…的别名权重键。

# 兼容直接使用 Config 的默认值。命令行入口由 RunSession 覆盖：
# 未指定 --memory-bank 时使用本轮独立库；指定路径则复用该库。
memory_db_dir: "outputs/memory_db_carla"

# 服务器缓存由用户上传；默认不对 Hugging Face 发起 HEAD/下载请求。
feature_extractor:
  local_files_only: true
  cache_dir: ".cache/huggingface"
  model_dir: null              # 可选：含 config.json 的本地模型或 snapshot 目录

fallback:
  allow_rule_fallback_for_format_error: false  # CARLA 解析失败必须制动，保留真实模型失败

# ---- 感知输入：固定六视角环视（复用 src 现有 surround_mosaic 路径）----
perception:
  mode: "surround_mosaic"
  cameras:                       # 2x3 行优先顺序：上排前向三摄、下排后向三摄
    - "CAM_FRONT_LEFT"
    - "CAM_FRONT"
    - "CAM_FRONT_RIGHT"
    - "CAM_BACK_LEFT"
    - "CAM_BACK"
    - "CAM_BACK_RIGHT"
  mosaic:
    cell_width: 480
    cell_height: 270
    label_subimages: true
  oracle_objects: true           # 注入 CARLA GT 感知对象（is_oracle=True）
  oracle:
    max_distance_m: 100.0         # 过滤距 ego 超过此距离的目标

carla:
  # ---- 连接 ----
  host: "127.0.0.1"
  port: 2000
  traffic_manager_port: null    # null = 实际CARLA RPC端口+6000；多实例必须独立，2000默认8000
  timeout_s: 30.0
  python_api_dir: "D:/software/carla/WindowsNoEditor/PythonAPI/carla"  # 兼容保留；自实现 A*（route_planner.py）后不再使用 agents.GlobalRoutePlanner，可删除
  # ---- 同步模式 ----
  synchronous: true
  fixed_delta_seconds: 0.1       # 10 Hz（20Hz 在 Town05 大图物理算不完易触发 UE4 fatal，降为 10Hz 稳定）
  capture_timeout_s: 2.0       # 六路相机共享的等待截止时间，不推进仿真
  max_capture_failures: 3      # 连续采集失败时结束本轮，失败期间全刹
  # ---- 闭环节奏 ----
  replan_interval_s: 3.0         # VLM 每 3s 更新语义意图，PDM 独立高频规划
  planning:
    backend: "pdm_closed"       # pdm_closed | vlm_trajectory（旧版轨迹模式）
    semantic_influence: true    # 消融只切换语义加分；最终选择=PDM基础分+语义分
    model_inference: true      # false跳过双VLM/DINO/记忆/认知相机；要求pdm_closed、semantic_influence=false、memory_off
    replan_interval_s: 0.2      # PDM 更新周期；VLM 意图在两次认知之间保持
    horizon_s: 4.0              # 不短于 VLM 周期；轨迹由官方 PDM 核心产生
    sample_interval_s: 0.1      # 固定版本官方 TTC 实现使用 10Hz 索引
    lqr_lateral_horizon_s: 2.0  # 横向预瞄；纵向保留原生1s制动预测；整数采样、>=2个采样且<=规划时域
    max_speed_mps: 8.0          # 适配首轮保守上限，同时服从当前道路限速
    map_radius_m: 100.0
    lane_change_length_m: 30.0
    lateral_semantic_weight: 0.8
    longitudinal_semantic_weight: 0.8
  max_duration_s: 300.0          # 超时保护；到时路线未完成则失败，不作为成功条件
  route_completion_tolerance_m: 2.0  # 按顺序经过整条路线，且当前距终点 <= 此值
  route_tracking_tolerance_m: 5.0    # 中途路线走廊，允许一次正常变道/避让
  max_trajectory_rejections: 3       # 连续不合格轨迹终止；每次拒绝立即全刹
  trajectory_validation:
    max_speed_mps: 25.0
    max_acceleration_mps2: 4.0
    max_deceleration_mps2: 8.0
    max_lateral_acceleration_mps2: 6.0
    speed_tolerance_mps: 1.5
    position_tolerance_m: 0.25
    max_initial_heading_deg: 75.0
  # ---- 卡死检测（低速且无路线进展 → 警告 → 提前终止，防卡死后空烧 VLM）----
  stuck_detection:
    enabled: true
    speed_thresh_mps: 0.3
    warn_after_s: 10.0
    terminate_after_s: 20.0
  # ---- 路由中心线注入决策 prompt（米制回正锚点）----
  # VLM 无法从 480×270 图像定量判断横向偏移（车道线仅 2-3px、无标定参考），
  # 避让后 KEEP_LANE 只会沿偏移位置平行直行、误差永不收敛。A* 路由点即 CARLA
  # 车道中心，转 ego-centric 后以 route_center 伪对象注入 perception_objects
  # （锚点仅作几何参考，时间采样仍须符合当前速度与动力学）。对 memory_on/off 同等生效。
  route_injection:
    enabled: true
    num_points: 6              # 注入前方中心点数
    step_m: 2.0                # 点间距（米）；num_points×step_m = 6×2 = 12m 覆盖前方规划域
  # ---- ego 车辆 ----
  ego:
    blueprint: "vehicle.tesla.model3"
    spawn_point: null            # null = 由场景 YAML 指定或随机
  # ---- 6 相机布置（相对 ego 的 transform；P1 实测调参）----
  # CARLA: x 前、y 右、z 上；yaw 正=顺时针(向右，+y=右)（实测，与 nuScenes 相反）。
  cameras:
    - {name: "CAM_FRONT_LEFT",  x:  1.0, y: -1.0, z: 1.4, pitch: 0, yaw:  -45, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_FRONT",       x:  1.2, y:  0.0, z: 2.0, pitch: 0, yaw:    0, roll: 0, fov: 120, width: 640, height: 360}
    - {name: "CAM_FRONT_RIGHT", x:  1.0, y:  1.0, z: 1.4, pitch: 0, yaw:   45, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_BACK_LEFT",   x: -1.0, y: -1.0, z: 1.4, pitch: 0, yaw: -135, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_BACK",        x: -2.8, y:  0.0, z: 1.8, pitch: 0, yaw:  180, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_BACK_RIGHT",  x: -1.0, y:  1.0, z: 1.4, pitch: 0, yaw:  135, roll: 0, fov: 100, width: 640, height: 360}
  # ---- 图像/产物落盘 ----
  output:
    image_dir: "outputs/carla_images"
    mosaic_dir: "outputs/mosaic"
  # ---- 控制器（Pure Pursuit 横向 + PID 纵向）----
  controller:
    wheelbase_m: 2.8
    max_steer_rad: 0.6
    lookahead_min_m: 3.0
    lookahead_max_m: 12.0
    lookahead_k: 0.5             # lookahead = clamp(min + k*speed, min, max)
    pid:
      kp: 1.6                # 原 1.0 偏软：2 m/s 误差油门仅 0.2，起步肉
      ki: 0.05
      kd: 0.05
      max_throttle: 0.75
      max_brake: 0.8
      deadband_mps: 0.15     # 死区：小误差滑行，防油门/刹车抖动
    control_dt_s: 0.1        # 控制周期 = fixed_delta_seconds（scripted NPC PID 用）
    steer_sign: -1               # 项目 steer_rad 左正 ↔ CARLA VehicleControl.steer 右正（+yaw=右转，实测），故取反
  # ---- 驾驶视频录制（独立小功能，默认关）----
  # 仅在 CARLA 推进 tick 取帧（跳过 VLM 冻结期），视频时长 = 仿真实际驾驶时间
  video:
    enabled: true
    fps: 10                      # = 1/fixed_delta（=0.1s），视频按 sim 实时速度播放
    width: 1280                   # Town05 大图降视频相机分辨率（1280×720→640×360）防 UE4 崩溃
    height: 720
    view: "chase"                # chase（后上方第三人称）| front（前视角）
  # ---- 场景 ----
  scenario_dir: "carla_bridge/config/scenarios"
  default_scenario: "straight_traffic"
