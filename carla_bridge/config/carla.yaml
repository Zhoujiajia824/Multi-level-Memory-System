# =============================================================================
# CARLA 闭环集成配置（carla_bridge）
# =============================================================================
# 与 src/vla_memory 的 config/*.yaml 解耦：本文件由 carla_bridge 入口脚本
# 通过 load_config(overrides=<本文件内容>) 深合并进主配置，不改 src/、
# 不改现有 config/。carla_bridge 代码用 config.get_nested("carla", ...) 读取。
# =============================================================================

# ---- 顶层：数据集标识（写入中期记忆 source_dataset，与 nuScenes 区分）----
dataset_name: "carla"
version: "0.9.15"

# ⚠️ 历史 workaround 已移除：src/vla_memory/memory/mid_term_memory.py 的检索权重键名
# 错位（f"{key}_weight" 查 visual_score_weight，而 memory.yaml 定义 visual_weight）已修复，
# 无需再注入视觉/文本/…的别名权重键。

# 兼容直接使用 Config 的默认值。命令行入口由 RunSession 覆盖：
# 未指定 --memory-bank 时使用本轮独立库；指定路径则复用该库。
memory_db_dir: "outputs/memory_db_carla"

# 服务器缓存由用户上传；默认不对 Hugging Face 发起 HEAD/下载请求。
feature_extractor:
  local_files_only: true
  cache_dir: ".cache/huggingface"
  model_dir: null              # 可选：含 config.json 的本地模型或 snapshot 目录

fallback:
  allow_rule_fallback_for_format_error: false  # 不伪造模型建议；selective建议失败回到PDM，always保留旧制动

# ---- 感知输入：固定六视角环视（复用 src 现有 surround_mosaic 路径）----
perception:
  mode: "surround_mosaic"
  cameras:                       # 2x3 行优先顺序：上排前向三摄、下排后向三摄
    - "CAM_FRONT_LEFT"
    - "CAM_FRONT"
    - "CAM_FRONT_RIGHT"
    - "CAM_BACK_LEFT"
    - "CAM_BACK"
    - "CAM_BACK_RIGHT"
  mosaic:
    cell_width: 480
    cell_height: 270
    label_subimages: true
  oracle_objects: true           # 注入 CARLA GT 感知对象（is_oracle=True）
  oracle:
    max_distance_m: 100.0         # 过滤距 ego 超过此距离的目标

carla:
  # ---- 连接 ----
  host: "127.0.0.1"
  port: 2000
  traffic_manager_port: null    # null = 实际CARLA RPC端口+6000；多实例必须独立，2000默认8000
  timeout_s: 30.0
  python_api_dir: "D:/software/carla/WindowsNoEditor/PythonAPI/carla"  # 兼容保留；自实现 A*（route_planner.py）后不再使用 agents.GlobalRoutePlanner，可删除
  # ---- 同步模式 ----
  synchronous: true
  fixed_delta_seconds: 0.1       # 10 Hz（20Hz 在 Town05 大图物理算不完易触发 UE4 fatal，降为 10Hz 稳定）
  capture_timeout_s: 2.0       # 六路相机共享的等待截止时间，不推进仿真
  max_capture_failures: 3      # 连续采集失败时结束本轮，失败期间全刹
  # ---- 闭环节奏 ----
  replan_interval_s: 3.0         # always/语义off认知周期；selective/shadow条件查询，数值后端独立高频规划
  planning:
    backend: "mpc"              # mpc（默认约束滚动优化）| pdm_closed（保留对照）| vlm_trajectory
    mpc:
      dt: 0.2                   # 优化离散步长；控制仍按0.1s，优化转向按区间保持
      horizon_steps: 20          # 4s预测，首段执行后重新求解
      max_iterations: 55
      collision_margin: 0.2      # 车体与实测运动/连续车道预测障碍的额外净空
      multi_start: true          # 热启动、参考跟踪及制动初值；每个均重新受约束优化
    lateral_control: "native_lqr"  # 仅PDM：原生LQR转向；MPC直接执行优化转向，纵向均用速度曲线PID
    semantic_influence: true    # false禁止语义影响；selective另需当前证据授权，shadow执行数值基线
    semantic_policy: "selective"  # selective条件介入 | always旧版无条件加分 | shadow只记录would-selection
    planning_memory: "full"     # off | gate仅辅助介入判断 | full另提供数值规划先验；memory_off仍禁读写
    model_inference: true      # false不初始化双VLM/DINO/文本记忆/认知相机；语义必须off，可选memory_on+planning_memory=full
    replan_interval_s: 0.2      # 数值更新周期；MPC<=0.3s；selective建议每次重验，过期/释放即丢弃
    horizon_s: 4.0              # 数值轨迹时域；不等于语义建议租期，后者最多6s
    sample_interval_s: 0.1      # PDM固定版本官方 TTC 使用10Hz索引；MPC步长另见mpc.dt
    lqr_lateral_preview: "speed_scaled"  # 实测速度/轴距确定预瞄；fixed用于固定预瞄对照；旧缺键仍fixed
    lqr_lateral_horizon_s: 2.0  # 横向上限/固定值；纵向保留原生1s制动预测；整数采样且<=规划时域
    lqr_lateral_min_horizon_s: 1.0  # speed_scaled下限；低速使用2s，车速上升后缩短至1s
    max_speed_mps: 8.0          # 适配首轮保守上限，同时服从当前道路限速
    map_radius_m: 100.0
    lane_change_length_m: 30.0
    actor_motion:               # 仅当前/过去观测与真实道路连接，不读取未来仿真状态
      history_window_s: 0.6     # 修正CARLA行人移动但速度API为0；车辆API经位移核验一致则保留瞬时速度
      map_guidance: true        # 对齐道路的车辆沿next()预测；分叉不明确/正在变道时回退实测运动
      map_max_lateral_speed_mps: 0.35
    lane_quality:              # 对实际预测车身计算数值软成本；纯PDM/语义模式一致，无额外轨迹硬筛
      enabled: true
      center_weight: 0.04
      boundary_weight: 0.12
      center_tolerance_m: 0.15
      boundary_margin_m: 0.15
      horizon_s: 2.0
      lane_change_start_cost: 0.02  # 降低每次重置普通变道路径造成的机动切换
    lane_maneuver:             # 持续慢障碍的合法变道绕行，固定地图锚点，越过后择机返回
      enabled: true
      observation_s: 1.0
      minimum_gap_m: 1.0        # 仅中心距离初筛；实际车体间隙、曲率及整段碰撞仍单独核验
      maximum_blocker_distance_m: 45.0
      slow_speed_fraction: 0.6
      maximum_pass_speed_mps: 5.0  # 提交机动后，同目标普通/offset候选也绑定已核验的机动速度上限
      lateral_acceleration_mps2: 1.4
      return_clearance_m: 8.0
      maximum_maneuver_s: 45.0
    lateral_semantic_weight: 0.8       # always旧权重；selective默认横/纵各0.04、总上限0.08
    longitudinal_semantic_weight: 0.8  # selective阈值见planning.semantic_governor（省略采用默认）
    semantic_governor:          # selective/shadow；只限制顾问影响，不硬筛原生候选
      base_regret_budget: 0.08
      max_semantic_bonus: 0.08
      lateral_weight: 0.04
      longitudinal_weight: 0.04
      min_query_interval_s: 2.0
      wait_review_interval_s: 15.0  # 兼容旧配置；正常信号/队列等待已取消周期模型复核
      recovery_degraded_duration_s: 2.0
      recovery_min_observations: 3
      recovery_release_healthy_duration_s: 2.0
      recovery_release_progress_m: 2.0
    recovery:                 # 仅selective/shadow且语义on，经模型明确请求后扩展；纯数值不触发
      enabled: true
      max_paths: 15
      transition_lengths_m: [2.0, 3.0, 4.0]
      max_offset_m: 0.5
      side_clearance_m: 0.1
  max_duration_s: 300.0          # 超时保护；到时路线未完成则失败，不作为成功条件
  route_completion_tolerance_m: 2.0  # 按顺序经过整条路线，且当前距终点 <= 此值
  route_tracking_tolerance_m: 5.0    # 中途路线走廊，允许一次正常变道/避让
  max_trajectory_rejections: 3       # 连续不合格轨迹终止；每次拒绝立即全刹
  trajectory_validation:
    max_speed_mps: 25.0
    max_acceleration_mps2: 4.0
    max_deceleration_mps2: 8.0
    max_lateral_acceleration_mps2: 6.0
    speed_tolerance_mps: 1.5
    position_tolerance_m: 0.25
    max_initial_heading_deg: 75.0
  # ---- 卡死检测（低速且无路线进展 → 警告 → 提前终止，防卡死后空烧 VLM）----
  stuck_detection:
    enabled: true
    speed_thresh_mps: 0.3
    warn_after_s: 10.0
    terminate_after_s: 20.0
  # ---- 路由中心线注入决策 prompt（米制回正锚点）----
  # VLM 无法从 480×270 图像定量判断横向偏移（车道线仅 2-3px、无标定参考），
  # 避让后 KEEP_LANE 只会沿偏移位置平行直行、误差永不收敛。A* 路由点即 CARLA
  # 车道中心，转 ego-centric 后以 route_center 伪对象注入 perception_objects
  # （锚点仅作几何参考，时间采样仍须符合当前速度与动力学）。对 memory_on/off 同等生效。
  route_injection:
    enabled: true
    num_points: 6              # 注入前方中心点数
    step_m: 2.0                # 点间距（米）；num_points×step_m = 6×2 = 12m 覆盖前方规划域
  # ---- ego 车辆 ----
  ego:
    blueprint: "vehicle.tesla.model3"
    spawn_point: null            # null = 由场景 YAML 指定或随机
  # ---- 6 相机布置（相对 ego 的 transform；P1 实测调参）----
  # CARLA: x 前、y 右、z 上；yaw 正=顺时针(向右，+y=右)（实测，与 nuScenes 相反）。
  cameras:
    - {name: "CAM_FRONT_LEFT",  x:  1.0, y: -1.0, z: 1.4, pitch: 0, yaw:  -45, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_FRONT",       x:  1.2, y:  0.0, z: 2.0, pitch: 0, yaw:    0, roll: 0, fov: 120, width: 640, height: 360}
    - {name: "CAM_FRONT_RIGHT", x:  1.0, y:  1.0, z: 1.4, pitch: 0, yaw:   45, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_BACK_LEFT",   x: -1.0, y: -1.0, z: 1.4, pitch: 0, yaw: -135, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_BACK",        x: -2.8, y:  0.0, z: 1.8, pitch: 0, yaw:  180, roll: 0, fov: 100, width: 640, height: 360}
    - {name: "CAM_BACK_RIGHT",  x: -1.0, y:  1.0, z: 1.4, pitch: 0, yaw:  135, roll: 0, fov: 100, width: 640, height: 360}
  # ---- 图像/产物落盘 ----
  output:
    image_dir: "outputs/carla_images"
    mosaic_dir: "outputs/mosaic"
  # ---- 控制器（PDM横向由planning.lateral_control选择；旧VLM用Pure Pursuit；纵向PID）----
  controller:
    wheelbase_m: 2.8
    max_steer_rad: 0.6
    lookahead_min_m: 3.0
    lookahead_max_m: 12.0
    lookahead_k: 0.5             # lookahead = clamp(min + k*speed, min, max)
    pid:
      kp: 1.6                # 原 1.0 偏软：2 m/s 误差油门仅 0.2，起步肉
      ki: 0.05
      kd: 0.05
      max_throttle: 0.75
      max_brake: 0.8
      deadband_mps: 0.15     # 死区：小误差滑行，防油门/刹车抖动
    control_dt_s: 0.1        # 控制周期 = fixed_delta_seconds（scripted NPC PID 用）
    steer_sign: -1               # 项目 steer_rad 左正 ↔ CARLA VehicleControl.steer 右正（+yaw=右转，实测），故取反
  # ---- 驾驶视频录制（当前默认开，可用 --record-video off 关闭）----
  # 仅在CARLA推进tick登记帧（跳过VLM冻结期）；缺帧会缩短视频，时间对应以帧索引为准
  video:
    enabled: true
    fps: 10                      # = 1/fixed_delta（=0.1s），视频按 sim 实时速度播放
    width: 1280                   # Town05 大图降视频相机分辨率（1280×720→640×360）防 UE4 崩溃
    height: 720
    view: "chase"                # chase（后上方第三人称）| front（前视角）
    frame_timeout_s: 0.0         # 非阻塞；GPU图像延迟到达后按原CARLA帧补写
    hud: true                   # 视频叠加时间、CARLA帧、最近模型调用和轨迹选择
  replay:
    enabled: true               # 自动生成 replay/index.html；归档实际模型输入，含历史记忆图片
  visualization:
    trajectories:
      enabled: false            # --trajectory-visualization on 开启录像轨迹标注
      style: "paper"            # paper: 无发光连续实线投影；classic: 旧版世界debug实线
      max_candidates: 6         # 仅显示上限；优先横向覆盖和差异，获选者始终显示；0不设上限
      merge_distance_m: 0.12    # 近重复完整几何仅显示代表；0禁用合并；所有原候选仍保留在日志
      point_stride: 2           # 仅classic抽样；paper连接每一个真实折点
      lifetime_s: 0.20          # 仅classic使用；paper逐帧投影，不按有效期消失
      thickness: 0.055          # 候选色芯宽度，米
      selected_thickness: 0.20  # 深蓝灰：实际获选候选，宽于执行计划
      execution_thickness: 0.09 # 陶土色：校验通过、下发控制器的未来计划
      outline_width: 0.0        # 默认不描边、不添加光晕；正数可显式加细描边
      z_offset: 0.15
  # ---- 场景 ----
  scenario_dir: "carla_bridge/config/scenarios"
  default_scenario: "straight_traffic"
