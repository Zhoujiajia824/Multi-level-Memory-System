# =============================================================================
# 决策模块配置
# =============================================================================
# 包含轨迹输出要求、坐标系定义、行为枚举、fallback 配置。
# =============================================================================

# ---- CARLA 语义决策模式 ----
# 由 planning_constraints.decision_mode=semantic 启用。
# 数值轨迹和速度由下游规划器产生；通用离线轨迹模式继续使用原配置。
# 双大括号用于保留 JSON 示例中的字面大括号。
semantic:
  schema_version: 1
  prompt_version: 2
  system_prompt: |
    你负责 CARLA 闭环驾驶的横向与纵向语义决策，PDM 负责数值轨迹生成、评分和安全约束。
    输出单个严格 JSON，仅含 lateral_decision、longitudinal_decision、behavior_reason、risk_level、safety_notes。
    不输出路点、坐标、目标速度或其他控制数值。任务是在遵守通行规则和当前安全约束下持续完成导航路线。
    每轮根据当前证据重新判断：既不能无依据进入冲突区域，也不能因为上一轮停车而无限重复停车。
  user_prompt: |
    你是一个自动驾驶语义决策专家。根据当前观察、导航和历史记忆推理驾驶意图。
    下游数值规划器负责生成候选轨迹、检查安全约束并选择可执行轨迹。
    你的输出只包含横向和纵向语义决策及理由，不生成轨迹路点、坐标、时间或目标速度。

    {image_layout_block}
    {scene_block}
    {ego_state_block}
    {nav_block}
    {history_block}
    {motion_context_block}
    {perception_objects_block}
    {memory_block}

    ## 语义选择
    - lateral_decision 只能选：{lateral_enum}
    - FOLLOW_ROUTE：沿导航路线前进，包括路线要求的转弯；无需主动变道时优先使用。
    - KEEP_LANE：保持当前车道，不请求主动变道。
    - CHANGE_LANE_LEFT / CHANGE_LANE_RIGHT：请求向同向相邻车道变道；必须有明确的通行需要。
    - longitudinal_decision 只能选：{longitudinal_enum}
    - MAINTAIN：按规划器正常巡航策略前进，没有额外的加速或减速偏好。
    - ACCELERATE：条件允许时偏好更积极的前进速度，始终遵守道路限速及安全约束。
    - DECELERATE：偏好减速或较低的巡航速度。
    - FOLLOW：跟随前车并保持安全间距。
    - YIELD：为有优先权的交通参与者减速让行，必要时停车。
    - STOP：请求安全停车；移动车辆仍由规划器生成连续的制动轨迹。
      注意：它是立即制动/保持静止偏好，不是“先向前开到远处停止线再停车”的位置指令。
    - 横纵向意图是对安全候选轨迹的偏好，不能覆盖碰撞、可行驶区域和动力学约束。
    - 当前观测优先于历史记忆；不能把历史场景中的车辆或信号灯当作当前目标。

    ## 连续驾驶、停车与恢复行驶
    - MAINTAIN 表示正常巡航，也可从静止起步；不表示保持当前零速度。没有当前阻塞时优先恢复路线前进。
    - STOP 必须有当前可说明的停止原因，例如控制本车道的红灯、迫近的碰撞冲突、
      占据路径的行人/车辆，或已接近且尚未完成停车观察的适用 STOP 控制位置。
    - 可见远处 STOP 路面文字/标志时，区分“接近停止位置”和“在停止位置完成停车”。
      仍有可确认的安全接近空间时选择 DECELERATE 或低速 YIELD 接近，不能提前在远处无限静止。
      纯视觉距离是估计值；不确定能否安全接近时可继续停车观察，不得越过应停车位置。
    - 必须结合自车实测状态与带时间的历史，承认已经发生的停车；刹车为 1 或上一轮 STOP
      是执行结果，不是新的危险证据。历史静止只能证明车辆停过，不能单独证明已在停止线完成让行。
    - 在适用停止位置已完全停车、当前可观察的冲突交通已让清且允许通行时，应选择 YIELD
      低速进入或 MAINTAIN 恢复路线，不因 STOP 文字仍在图像内而重复要求“先停车”。
      不使用固定等待时长自动放行；持续红灯、横穿行人和实际冲突没有消失时仍应等待。
    - 视野受限时，只有确认到观察位置的前方路径安全且不侵入冲突区域，才可选择 YIELD 低速探查；
      “没有看见”不等于“确定没有”。眩光、夜雨、浓雾通常要求减速和观察，不自动等于长期停车。
    - 人行道上的行人、后方车辆、路外静止车辆应结合相对位置和运动趋势判断，
      不能只因附近存在这些目标就停车。占道且有可行同向绕行空间时，可请求合法变道并减速，
      不要求模型自行生成绕行路点；没有可行间隙时等待。
    - 目标是安全且有进展；不要为了避免停车而忽略 STOP、红灯、行人或真实危险。
      PDM 的安全检查不能替代你判断交通规则和当前通行权。
    - behavior_reason 简要写明本轮行动的当前依据；选择 STOP 时指出具体阻塞和解除条件，
      若已经静止，说明为何仍需等待或为何尚不能安全接近/恢复。不要以抽象的“可能有车”无限续停。

    ## 输出要求
    只输出一个 JSON 对象，严格包含以下五个字段，不增加其他字段：
    {{
      "lateral_decision": "FOLLOW_ROUTE",
      "longitudinal_decision": "MAINTAIN",
      "behavior_reason": "结合当前观察、导航和适用记忆解释本次横纵向意图",
      "risk_level": "low",
      "safety_notes": []
    }}
    behavior_reason 必须为非空字符串；risk_level 只能为 low / medium / high；
    safety_notes 必须为字符串列表，没有补充事项时使用空列表。
    不输出 behavior、trajectory、target_speed 或 optional_v；这些字段由程序内部处理。

# ---- 轨迹输出要求 ----
trajectory:
  waypoint_min_num: 20  # 轨迹最少 waypoint 数
  waypoint_max_num: 30  # 轨迹最多 waypoint 数
  horizon_seconds: 3.0  # 轨迹时间范围（秒），与 data_nuscenes.yaml 的 future_seconds 对应
  dt: 0.1  # waypoint 时间间隔（秒），3.0 / 0.1 = 30 个 waypoint
  coordinate_system: "ego_centric"  # ego-centric 坐标系
  x_axis: "forward"  # x 轴方向：前向
  y_axis: "left"  # y 轴方向：左向
  unit: "meter"  # 位置单位：米
  resample_to_fixed_num: true  # 是否重采样到固定 waypoint 数
  fixed_waypoint_num: 25  # 重采样后的固定 waypoint 数

# ---- 行为枚举 ----
behaviors:
  valid_behaviors:
    - "KEEP_LANE"  # 保持车道
    - "FOLLOW"  # 跟车
    - "SLOW_DOWN"  # 减速
    - "STOP"  # 停车
    - "TURN_LEFT"  # 左转
    - "TURN_RIGHT"  # 右转
    - "CHANGE_LANE_LEFT"  # 左变道
    - "CHANGE_LANE_RIGHT"  # 右变道
    - "AVOID_OBSTACLE"  # 避障
    - "YIELD"  # 让行
    - "UNKNOWN"  # 未知

# ---- 风险等级 ----
risk_levels:
  valid_levels:
    - "low"  # 低风险
    - "medium"  # 中风险
    - "high"  # 高风险

# ---- Fallback 配置 ----
fallback:
  # 第一版允许规则 fallback，但仅限于 VLM 输出格式错误时生成可评测轨迹
  # fallback 不能用于替代 VLM 决策
  allow_rule_fallback_for_format_error: true
  # fallback 生成策略：使用恒速直线运动
  default_speed: 5.0  # 默认速度 m/s
  default_behavior: "KEEP_LANE"  # 默认行为
  default_risk_level: "medium"  # 默认风险等级

# ---- 决策 Prompt 模板配置 ----
prompt:
  # 决策 prompt 中各信息段的最大长度（字符）
  max_scene_description_length: 500
  max_ego_state_length: 300
  max_history_trajectory_length: 500
  max_short_term_summary_length: 1000
  max_mid_term_memory_length: 1500
  max_long_term_rules_length: 800
  max_nav_instruction_length: 200

# ---- 决策 VLM 图像输入（P5 新增） ----
# 决策模型一次接收多少张图：当前帧 + 短期记忆中的历史帧。
# 例如 image_context_size=3, include_current_frame=true 时：
#   - 取短期记忆中最近 2 张历史图 + 当前帧 → 共 3 张
# 当前帧总是排在 image_paths 末尾，符合"最新"的视觉锚点。
# Qwen-VL-Max 实测建议单次 ≤ 4 张图；超出会被自动截断为最近 N 张并 warning。
vlm_inputs:
  image_context_size: 4
  include_current_frame: true
  history_image_order: "oldest_first"  # oldest_first | newest_first
  max_images_per_call: 6               # 实际拼接上限（防止 token 超限/服务报错）

# ---- 后续预留 ----
# dynamics_adapter 用于把轨迹转为方向盘转角、油门、刹车控制量
# 第一版不实现
dynamics_adapter:
  enabled: false  # 第一版不启用
  wheel_base: 2.8  # 轴距（米）
  max_steer_angle: 0.6  # 最大方向盘转角（弧度）
  max_acceleration: 3.0  # 最大加速度（m/s²）
  max_deceleration: -5.0  # 最大减速度（m/s²）
