# 复用服务器已部署的兼容 OpenAI 视觉服务；密钥仅从环境变量读取。
# 此模板不启动或修改服务。独立个人配置可使用 config/models.yaml（不提交）。
fast:
  backend: server
  base_url: http://127.0.0.1:8000/v1
  model: Qwen2.5-VL-3B-Instruct
  api_key_env: FAST_VLM_API_KEY
  timeout_s: 60
  max_tokens: 4096
  # 对齐当前8000服务max_model_len；不改变服务配置，输出可在窗口内按需调整。
  context_window_tokens: 16384
  temperature: 0.2
  # 仅必要结构；退化输出的第二次请求显式加反馈并放松为json_object/text。
  response_format: json_schema
reflection:
  # 与fast复用部署服务，但使用config/prompts.yaml的reflection提示词。
  # 旧个人配置未提供reflection或仍为off时，B组同样复用fast服务并明确归档。
  backend: server
  base_url: http://127.0.0.1:8000/v1
  model: Qwen2.5-VL-3B-Instruct
  api_key_env: FAST_VLM_API_KEY
  timeout_s: 60
  max_tokens: 4096
  context_window_tokens: 16384
  temperature: 0.2
  response_format: json_schema
