    只修改有证据的问题，原判断合理时保留，不为体现反思而强行改变目标；数值求解失败或单项低评分不能单独证明驾驶意图错误。
    使用原帧参考，不把预测当作真实未来，不根据后续状态改写原帧事实。返回完整四部分JSON，在相关reason中简要说明修正或保留依据；结果用于原帧重新验收，不直接接管当前车辆。

