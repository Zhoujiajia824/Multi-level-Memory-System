# CARLA 0.9.15平台与传感器设置；实验场景分别放在config/carla_scenarios/。
# 场景地图由独立场景YAML指定；开发默认值尚未完成真实服务器验收。
# 主程序Python 3.12与CARLA SDK解释器分离。python通过--carla-python提供绝对路径。
carla:
  python: null
  host: 127.0.0.1
  port: 2000
  timeout_s: 30
  # 显式开启后每轮都重新加载世界（同图也reload），保留50Hz同步设置。
  # 不接管已有车辆/行人/脚本道具或同步运行的他人世界。
  allow_world_reset: false
  # sync等待本次计算后推进；async由独立时钟推进，模型在后台返回。
  runtime_mode: sync
  # 重规划可选1/2/10Hz；同步模式默认10Hz，计算结束后再执行0.1秒。
  planner_hz: 10
  # 50Hz踏板执行：有符号a前馈+速度/加速度反馈；默认标定待真实闭环验收。
  longitudinal_control:
    throttle_full_acceleration_mps2: 6.0
    brake_full_deceleration_mps2: 8.0
    speed_kp: 1.5
    acceleration_kp: 0.2
    acceleration_ki: 0.4
    integral_limit_mps2: 1.0
    stop_hold_brake: 0.5
    stop_speed_mps: 0.1
    intent_deadband_mps2: 0.05
  camera_width: 640
  camera_height: 360
  camera_fov: 100
  camera_height_m: 2.2
  # 六路RGB每物理帧采集50Hz（sensor_tick=0），每5物理帧选择同帧图像供10Hz使用和录像。
  # camera_capture_hz必须与clock.physics_hz一致；原始图片与模型源帧仍为1Hz；无深度。
  camera_capture_hz: 50
  camera_hz: 10
  # 制动预热期间逐物理帧核验六路RGB，激活初速后以同帧图像建立t0。
  # 预热推进与布局漂移单独审计；10Hz输出按整数物理帧选择，不依赖浮点相机节拍。
  display_queue_frames: 50  # 10Hz录像传输有界缓冲；溢出单列，不补造重复帧
  camera_save_hz: 1
  # RGB使用CARLA默认光照/色调处理；不创建深度相机。
  rgb_postprocess_effects: true
  arrival_margin_m: 3
  map_resolution_m: 2
  map_speed_cap_mps: 30
  same_level_tolerance_m: 1.5
  # 世界debug线可能被相机拍摄；严格无叠加采集时保持false。
  # 命令行--world-plan可开启；RGB显示副本/录像的投影不依赖世界debug线。
  world_plan_debug: false
  display_plan_overlay: true
