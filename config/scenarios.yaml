# 场景与原生画面设置。修改此文件后重启程序生效；命令行显式参数优先。
# 算法参数统一位于 parameters.json，不能在 native 中改时钟、观测和连续动作契约。
highway:
  env_id: highway-v0
  desired_speed_mps: 25
  initial_speed_mps: 25
  vehicles_count: 12
  lanes_count: 4
  destination: "1"
  native:
    initial_lane_id: null
    ego_spacing: 2
    vehicles_density: 1
    screen_width: 1200
    screen_height: 300
    scaling: 11
    centering_position: [0.3, 0.5]
    show_trajectories: false
    real_time_rendering: false
