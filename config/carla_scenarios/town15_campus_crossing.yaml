# 独立场景；距离m、速度m/s、时间s，offset_m沿车道左正。
# route_anchors固定道路地点；修改actor距离/速度/触发条件可构造相似变体。
schema_version: carla-scene-1.2
name: town15_campus_crossing
template: scripted_traffic
map: Town15
description: 校园地图低速交互：真实人行道起步横穿，前方车辆低速通行。
desired_speed_mps: 5
duration_s: 180
experiment:
  spawn_index: null
  route_length_m: 450
  route_anchors:
  - road_id: 136
    lane_id: 1
    s_m: 100.000000
  route_requirements:
    kind: any
    min_junctions: 0
    min_same_direction_lanes: 1
    search_limit: 10000
  navigation_step_yaw_limit_deg: 30
  initial_speed_mps: 5
  ego_blueprint: vehicle.tesla.model3
  weather: ClearNoon
  actors:
  - role: pedestrian
    type: pedestrian
    blueprint: walker.pedestrian.0001
    placement:
      s_m: 45
      lane: sidewalk_right
      offset_m: 0
    behavior: cross
    speed_mps: 1.3
    trigger:
      time_s: 1
      ego_distance_m: 30
  - role: far_car
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      s_m: 100
      lane: current
      offset_m: 0
    behavior: follow
    speed_mps: 5
