# 对应分层Opt地图的独立配置；不是运行中自动替换地图。
schema_version: carla-scene-1.2
name: town02_school_crossing_opt
template: scripted_traffic
map: Town02_Opt
description: 校园式低速路段：两名行人分时从真实人行道横穿；不是地图学校POI标注。 分层Opt地图变体，保持相同道路锚点和交通参数。
desired_speed_mps: 5
duration_s: 150
experiment:
  spawn_index: null
  route_length_m: 400
  route_anchors:
  - road_id: 1
    lane_id: -1
    s_m: 0.0
  route_requirements:
    kind: any
    min_junctions: 0
    min_same_direction_lanes: 1
    search_limit: 10000
  navigation_step_yaw_limit_deg: 30
  initial_speed_mps: 5
  ego_blueprint: vehicle.tesla.model3
  weather: ClearNoon
  actors:
  - role: crossing_1
    type: pedestrian
    blueprint: walker.pedestrian.0001
    placement:
      s_m: 45
      lane: sidewalk_right
      offset_m: 0
    behavior: cross
    speed_mps: 1.2
    trigger:
      time_s: 1
      ego_distance_m: 28
  - role: crossing_2
    type: pedestrian
    blueprint: walker.pedestrian.0001
    placement:
      s_m: 50
      lane: sidewalk_right
      offset_m: 0
    behavior: cross
    speed_mps: 1.0
    trigger:
      time_s: 3
      ego_distance_m: 25
  - role: far_car
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      s_m: 95
      lane: current
      offset_m: 0
    behavior: follow
    speed_mps: 5
