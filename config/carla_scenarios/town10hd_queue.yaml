schema_version: carla-experiment-2.0
name: town10hd_queue
family: multi_vehicle
description: 60秒短队列任务；139米原路线后缀保留原终点，两前车同车道停车恢复，之后继续通过路口并到达。
map: Town10HD
status: candidate
split: development
desired_speed_mps: 6
duration_s: 60
experiment:
  ego_blueprint: vehicle.tesla.model3
  initial_speed_mps: 4
  weather: ClearNoon
  route:
    file: ../carla_routes/town10hd_queue.json
  actors:
  - role: lead
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      route:
        file: ../carla_routes/town10hd_queue_lead.json
      offset_m: 0
    behavior: stop_resume
    speed_mps: 5.5
    trigger:
      ego_s_m:
      - 2.0
      - 18.0
      earliest_tick: 50
    required: true
    duration_ticks: 200
    hold_ticks: 100
  - role: second_lead
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      route:
        file: ../carla_routes/town10hd_queue_second_lead.json
      offset_m: 0
    behavior: stop_resume
    speed_mps: 5
    trigger:
      ego_s_m:
      - 4.0
      - 35.0
      earliest_tick: 150
    required: true
    duration_ticks: 200
    hold_ticks: 250
  signals:
    green_ticks: 250
    yellow_ticks: 100
    all_red_ticks: 50
    offset_ticks: 0
  variations:
  - path: actors.0.speed_mps
    min: 5.2
    max: 5.8
  - path: actors.1.speed_mps
    min: 4.8
    max: 5.2
  - path: actors.1.hold_ticks
    min: 225
    max: 250
  public_rules: []
  evaluation:
    arrival_margin_m: 3
    stall_seconds: 45
