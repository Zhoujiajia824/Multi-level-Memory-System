schema_version: carla-experiment-2.0
name: town06_ramp_exit
family: ramp_exit
description: 实际匝道连接与主路交通；锁定路线终点及公开拓扑证据。
map: Town06
status: candidate
split: development
desired_speed_mps: 10
duration_s: 240
experiment:
  ego_blueprint: vehicle.tesla.model3
  initial_speed_mps: 10
  weather: ClearNoon
  route:
    file: ../carla_routes/town06_ramp_exit.json
  actors:
  - role: adjacent_flow
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      s_m: 10.0
      lane: right
      offset_m: 0
    behavior: follow
    speed_mps: 10
  signals:
    green_ticks: 500
    yellow_ticks: 150
    all_red_ticks: 50
    offset_ticks: 0
  variations:
  - path: actors.0.speed_mps
    min: 9.0
    max: 11.0
  public_rules: []
  evaluation:
    arrival_margin_m: 3
    stall_seconds: 45
