# 对应分层Opt地图的独立配置；不是运行中自动替换地图。
schema_version: carla-scene-1.2
name: town04_multilane_merge_opt
template: scripted_traffic
map: Town04_Opt
description: 单车道入口经公开连接汇入多车道主路；前方慢车形成速度调整需求。 分层Opt地图变体，保持相同道路锚点和交通参数。
desired_speed_mps: 12
duration_s: 180
experiment:
  spawn_index: null
  route_length_m: 900
  route_anchors:
  - road_id: 0
    lane_id: 1
    s_m: 20.0
  route_requirements:
    kind: merge
    min_junctions: 0
    min_same_direction_lanes: 2
    search_limit: 10000
  navigation_step_yaw_limit_deg: 30
  initial_speed_mps: 12
  ego_blueprint: vehicle.tesla.model3
  weather: ClearNoon
  actors:
  - role: ramp_lead
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      s_m: 30
      lane: current
      offset_m: 0
    behavior: follow
    speed_mps: 10
