# 独立场景；距离m、速度m/s、时间s，offset_m沿车道左正。
# route_anchors固定道路地点；修改actor距离/速度/触发条件可构造相似变体。
schema_version: carla-scene-1.2
name: town04_multilane_exit
template: scripted_traffic
map: Town04
description: 多车道主路经公开分流连接进入单车道出口，保持已知导航分支。
desired_speed_mps: 12
duration_s: 180
experiment:
  spawn_index: null
  route_length_m: 900
  route_anchors:
  - road_id: 35
    lane_id: -4
    s_m: 120.000000
  route_requirements:
    kind: diverge
    min_junctions: 0
    min_same_direction_lanes: 2
    search_limit: 10000
  navigation_step_yaw_limit_deg: 30
  initial_speed_mps: 12
  ego_blueprint: vehicle.tesla.model3
  weather: ClearNoon
  actors:
  - role: exit_lead
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      s_m: 40
      lane: current
      offset_m: 0
    behavior: follow
    speed_mps: 10
