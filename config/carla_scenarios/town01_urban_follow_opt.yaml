# 对应分层Opt地图的独立配置；不是运行中自动替换地图。
schema_version: carla-scene-1.2
name: town01_urban_follow_opt
template: scripted_traffic
map: Town01_Opt
description: 城市日常跟驰：慢车与远处前车，连续街区及路口。 分层Opt地图变体，保持相同道路锚点和交通参数。
desired_speed_mps: 8
duration_s: 120
experiment:
  spawn_index: null
  route_length_m: 500
  route_anchors:
  - road_id: 12
    lane_id: 1
    s_m: 40.0
  route_requirements:
    kind: any
    min_junctions: 0
    min_same_direction_lanes: 1
    search_limit: 10000
  navigation_step_yaw_limit_deg: 30
  initial_speed_mps: 8
  ego_blueprint: vehicle.tesla.model3
  weather: ClearNoon
  actors:
  - role: lead
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      s_m: 35
      lane: current
      offset_m: 0
    behavior: follow
    speed_mps: 6
  - role: far_lead
    type: vehicle
    blueprint: vehicle.audi.a2
    placement:
      s_m: 90
      lane: current
      offset_m: 0
    behavior: follow
    speed_mps: 8
