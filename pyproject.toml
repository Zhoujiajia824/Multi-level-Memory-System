[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nine-grid-rag-mpc"
version = "1.0.0"
description = "九宫格三通道检索增强规划与原帧反思实验"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["numpy>=2", "scipy>=1.15", "casadi==3.7.2", "shapely>=2", "highway-env==1.12.1", "gymnasium==1.3.0", "PyYAML>=6", "Pillow>=10", "matplotlib>=3.9", "openai>=2", "opencv-python>=4"]

[project.optional-dependencies]
vision = ["torch>=2.6", "transformers>=4.48"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = ["integration: 实际物理仿真，需要较长运行时间"]

[tool.ruff]
line-length = 120
